name: Auto Unzip Files
on:
  push:
    paths:
      - '**.zip' # Triggers when a zip file is pushed

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract All Zip Files
        run: |
          # Finds and extracts all zip files even if they are in different folders
          find . -name "*.zip" -exec sh -c 'unzip -o "$1" -d "$(dirname "$1")"' _ {} \;
          
          # Optional: deletes the zip files after successful extraction
          find . -name "*.zip" -delete 

      - name: Commit and Push Extracted Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Automated unzip via GitHub Actions" || echo "No changes to commit"
          git push
