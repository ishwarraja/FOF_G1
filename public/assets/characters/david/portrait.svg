<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Blue Gradient -->
    <radialGradient id="davidBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Neon Cobalt Glow Filter -->
    <filter id="neonCobalt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blurB" />
      <feMerge>
        <feMergeNode in="blurB" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Amber Eye Optics Glow -->
    <filter id="opticAmber" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blurA" />
      <feMerge>
        <feMergeNode in="blurA" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="davidArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="davidSkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#davidBg)" />

  <!-- Background Technical Blueprint Schematics -->
  <g opacity="0.2" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <circle cx="256" cy="240" r="180" stroke-dasharray="8 6" />
    <circle cx="256" cy="240" r="130" stroke-dasharray="4 4" />
    <line x1="0" y1="240" x2="512" y2="240" stroke-dasharray="12 8" />
    <line x1="256" y1="0" x2="256" y2="512" stroke-dasharray="12 8" />
  </g>

  <!-- Heavy Combat Armor -->
  <g id="armor">
    <path d="M 180 370 L 150 512 L 362 512 L 332 370 Z" fill="#090d16" />
    <!-- Titanium Pauldrons -->
    <path d="M 70 440 L 180 365 L 165 512 L 60 512 Z" fill="url(#davidArmor)" stroke="#475569" stroke-width="2" />
    <path d="M 442 440 L 332 365 L 347 512 L 452 512 Z" fill="url(#davidArmor)" stroke="#475569" stroke-width="2" />
    <!-- High-Voltage Conduit Plates -->
    <path d="M 130 430 L 195 380 L 210 512" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonCobalt)" />
    <path d="M 382 430 L 317 380 L 302 512" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonCobalt)" />
    <!-- Reinforced Collar -->
    <path d="M 190 325 L 256 365 L 322 325 L 300 305 L 212 305 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
  </g>

  <!-- Neck & Cyber Throat Seams -->
  <path d="M 226 270 L 226 335 L 286 335 L 286 270 Z" fill="url(#davidSkin)" />
  <line x1="242" y1="285" x2="242" y2="330" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" filter="url(#neonCobalt)" />
  <line x1="270" y1="285" x2="270" y2="330" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" filter="url(#neonCobalt)" />

  <!-- Head Base -->
  <g id="head">
    <path d="M 192 175 C 190 240 206 290 256 312 C 306 290 322 240 320 175 C 320 120 298 105 256 105 C 214 105 192 120 192 175 Z"
          fill="url(#davidSkin)" stroke="#64748b" stroke-width="1.5" />

    <!-- Left Eye (Cybernetic Optics Visor) -->
    <rect x="210" y="180" width="35" height="18" rx="4" fill="#090d16" stroke="#f59e0b" stroke-width="1.8" />
    <circle cx="227" cy="189" r="5" fill="#f59e0b" filter="url(#opticAmber)" />
    <circle cx="227" cy="189" r="2" fill="#ffffff" />

    <!-- Right Eye (Human Organic Focus) -->
    <ellipse cx="286" cy="189" rx="16" ry="8" fill="#ffffff" />
    <circle cx="284" cy="189" r="6" fill="#0f172a" />
    <circle cx="284" cy="189" r="3.5" fill="#38bdf8" />
    <circle cx="285" cy="187" r="1.5" fill="#ffffff" />

    <!-- Sharp Brow -->
    <path d="M 205 170 Q 224 162 246 174" stroke="#0f172a" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 307 170 Q 288 162 266 174" stroke="#0f172a" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- Jaw & Battle Scar -->
    <path d="M 256 182 L 253 224 L 259 226" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 238 250 Q 256 256 274 250" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Hair Short Tactical Military Fade -->
  <path d="M 182 160 C 176 80 205 45 256 45 C 307 45 336 80 330 160 C 314 105 295 85 256 90 C 217 85 198 105 182 160 Z"
        fill="#0f172a" />

  <rect x="3" y="3" width="506" height="506" rx="20" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.85" filter="url(#neonCobalt)" />
</svg>
